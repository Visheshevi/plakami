[project]
name = "platedet"
version = "0.1.0"
description = "Licence-aware plate and vehicle detector training project."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ImageHash>=4.3,<5", # BSD-2-Clause: perceptual image hashes for deduplication.
    "Pillow>=11,<13", # HPND: validate images and collect dimensions.
    "PyYAML>=6.0,<7", # MIT: load dataset configuration files.
    "numpy>=2,<3", # BSD-3-Clause: array maths for pre/post-processing and metrics.
    "onnxruntime>=1.20,<2", # MIT: run ONNX models for baselines, eval and parity.
    "pyarrow>=19,<25", # Apache-2.0: write the required Parquet manifest.
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.11,<1",
]
# Training/export only (YOLOX imports these). Licences checked 2026-11-12; none GPL/AGPL.
train = [
    "loguru>=0.7,<1", # MIT: YOLOX logging.
    "onnx>=1.16,<2", # Apache-2.0: export trained models to ONNX.
    "opencv-python-headless>=4.10,<5", # Apache-2.0 (bundled FFmpeg is LGPL): YOLOX image loading.
    "psutil>=6,<8", # BSD-3-Clause: YOLOX memory checks.
    "pycocotools>=2.0.8,<3", # BSD-2-Clause: YOLOX dataset loader and COCO AP during training.
    "tabulate>=0.9,<1", # MIT: YOLOX evaluation tables.
    "tensorboard>=2.17,<3", # Apache-2.0: training curves (SPEC §3).
    "thop==0.1.1.post2209072238", # MIT (Lyken17, not ultralytics-thop): YOLOX imports it for FLOPs.
    "torch>=2.4,<3", # BSD-3-Clause and permissive: training framework.
    "torchvision>=0.19,<1", # BSD-3-Clause: YOLOX uses its NMS ops.
    "tqdm>=4.66,<5", # MPL-2.0 AND MIT: YOLOX progress bars.
]

[tool.uv]
default-groups = ["dev", "train"]

[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/platedet"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
