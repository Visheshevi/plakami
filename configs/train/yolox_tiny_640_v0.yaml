# T3 v0: YOLOX-Tiny at 640px from the official COCO checkpoint (ADR-0009..0011).
# Run on Colab: notebooks/colab_train.ipynb. Defaults follow exps/default/yolox_tiny.py.
name: yolox_tiny_640_v0
seed: 42
input_size: 640
channel_order: bgr          # YOLOX trains on OpenCV (BGR) images (ADR-0010)
nms_iou: 0.45
min_box_px: 6               # drop training boxes whose short side is < 6 px at this size
pretrained:
  url: https://github.com/Megvii-BaseDetection/YOLOX/releases/download/0.1.1rc0/yolox_tiny.pth
  path: data/models/yolox_tiny.pth
  sha256: 9de513de589ac98bb92d3bca53b5af7b9acfa9b0bacb831f7999d0f7afaee8f0
  licence: Apache-2.0
data:
  combined_dir: data/processed/combined
  pseudo_labels: data/processed/pseudo_labels/yolox_l_vehicles.json
  training_dir: data/processed/yolox_640
train:
  max_epoch: 100            # official 300 is too long for free Colab; revisit in T4
  no_aug_epochs: 15
  warmup_epochs: 5
  batch_size: 32            # fits a free-tier T4 (16 GB) with fp16
  fp16: true
  basic_lr_per_img: 0.00015625   # 0.01 / 64, YOLOX default
  data_num_workers: 2       # free Colab has 2 vCPUs
  eval_interval: 10
  print_interval: 50
  mosaic_scale: [0.5, 1.5]
  # random_size: default = input_size/32 +- 5 (480-800 px)
